<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD Absensi Digital - IoT ESP32</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                        },
                        emerald: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                        },
                        rose: {
                            50: '#fff1f2',
                            500: '#f43f5e',
                            600: '#e11d48',
                        },
                        amber: {
                            50: '#fffbeb',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- SweetAlert2 for modern alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Highlight row animation on Realtime Tap */
        @keyframes highlight-fade {
            0% { background-color: #fef08a; transform: scale(1.01); }
            50% { background-color: #fef9c3; }
            100% { background-color: transparent; transform: scale(1); }
        }
        .row-highlight {
            animation: highlight-fade 2.5s ease-out;
        }

        /* Print Media Styling for Official PDF Export */
        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 11pt;
            }
            #sidebar, header, .no-print, button, form, .modal {
                display: none !important;
            }
            #app-root, #main-view-container, .print-area {
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }
            .table-print {
                width: 100% !important;
                border: 1px solid #333 !important;
                border-collapse: collapse !important;
            }
            .table-print th, .table-print td {
                border: 1px solid #444 !important;
                padding: 6px 8px !important;
                font-size: 10pt !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="h-full antialiased text-slate-800 bg-slate-100 flex flex-col min-h-screen">

    <!-- ROOT CONTAINER (Dynamic Single Component Viewport) -->
    <div id="app-root" class="h-full flex flex-col flex-1"></div>

    <!-- MODAL CONTAINER (Rendered on demand) -->
    <div id="modal-container"></div>

    <!-- SPA DYNAMIC ROUTER & LOGIC SCRIPT -->
    <script>
        const STORAGE_KEY_TOKEN = 'absensi_jwt_token';
        const STORAGE_KEY_USER = 'absensi_user_info';
        
        // App State
        let currentTab = 'laporan';
        let currentMemberTab = 'siswa';
        let rawAttendanceData = [];
        let allMembersCache = [];
        let sseEventSource = null;
        let clockInterval = null;
        let appSettings = {};

        function getApiBaseUrl() {
            if (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')) {
                return window.location.origin;
            }
            return 'http://localhost:8080';
        }

        function getAuthToken() {
            return localStorage.getItem(STORAGE_KEY_TOKEN);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            const token = getAuthToken();
            if (token) {
                renderDashboardLayout();
                switchTab('laporan');
                initSSE();
                fetchMembersCache();
                loadSettings();
            } else {
                renderLoginView();
            }
        }

        // -------------------------------------------------------------
        // 1. DYNAMIC COMPONENT TEMPLATES
        // -------------------------------------------------------------
        
        // TEMPLATE: LOGIN VIEW
        function renderLoginView() {
            if (sseEventSource) { sseEventSource.close(); sseEventSource = null; }
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }

            const root = document.getElementById('app-root');
            root.innerHTML = `
                <section class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-slate-900 via-primary-900 to-slate-900 relative overflow-hidden flex-1">
                    <div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-500/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

                    <div class="w-full max-w-md relative z-10">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-primary-600 to-primary-500 shadow-lg shadow-primary-500/30 text-white mb-4">
                                <i class="fa-solid fa-id-card-clip text-3xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">SIAKAD Absensi Digital</h1>
                            <p class="text-slate-400 text-sm mt-1">Sistem Pemantauan Absensi IoT ESP32 & SQLite</p>
                        </div>

                        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
                            <div class="mb-6">
                                <h2 class="text-xl font-bold text-slate-800">Masuk ke Web Admin</h2>
                                <p class="text-sm text-slate-500 mt-1">Gunakan akun administrator untuk mengelola sistem.</p>
                            </div>

                            <form id="form-login" class="space-y-5" onsubmit="handleLogin(event)">
                                <div>
                                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                            <i class="fa-solid fa-user"></i>
                                        </div>
                                        <input type="text" id="username" name="username" required placeholder="admin" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    </div>
                                </div>

                                <div>
                                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                            <i class="fa-solid fa-lock"></i>
                                        </div>
                                        <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                            <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" id="btn-login-submit" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-primary-600 hover:bg-primary-700 active:bg-primary-800 text-white font-medium rounded-xl shadow-lg shadow-primary-600/30 transition-all duration-150">
                                    <span id="btn-login-text">Masuk ke Dashboard</span>
                                    <i id="btn-login-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                                </button>
                            </form>

                            <div class="mt-6 pt-6 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-400">
                                <i class="fa-solid fa-database text-emerald-500"></i>
                                <span>Tersimpan di SQLite Database Permanen</span>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        // TEMPLATE: DASHBOARD SHELL (Navbar + Sidebar + Main Viewport)
        function renderDashboardLayout() {
            let userDisplayName = 'Administrator';
            try {
                const savedUser = JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || '{}');
                if (savedUser.name || savedUser.username) userDisplayName = savedUser.name || savedUser.username;
            } catch (e) {}

            const root = document.getElementById('app-root');
            root.innerHTML = `
                <div class="flex-1 flex flex-col md:flex-row min-h-screen">
                    <!-- SIDEBAR -->
                    <aside id="sidebar" class="w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col border-r border-slate-800 transition-all z-20">
                        <div class="h-16 px-6 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-xl bg-primary-600 flex items-center justify-center text-white font-bold shadow-md shadow-primary-600/30">
                                    <i class="fa-solid fa-fingerprint"></i>
                                </div>
                                <div>
                                    <span class="font-bold text-white tracking-wide text-sm block">ABSENSI IOT</span>
                                    <span id="sidebar-sse-status" class="text-[10px] text-emerald-400 font-medium block flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live Realtime
                                    </span>
                                </div>
                            </div>
                            <button class="md:hidden text-slate-400 hover:text-white" onclick="toggleMobileSidebar()">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <!-- Navigation Links -->
                        <div class="flex-1 py-6 px-4 space-y-1.5 overflow-y-auto">
                            <div class="px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Menu Utama</div>
                            
                            <button onclick="switchTab('laporan')" id="nav-laporan" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 font-medium border border-transparent transition-all text-left">
                                <i class="fa-solid fa-clipboard-user text-base w-5 text-center"></i>
                                <span>Laporan Absensi</span>
                            </button>

                            <div class="pt-3 px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Data Master</div>

                            <button onclick="switchTab('santri')" id="nav-santri" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 font-medium border border-transparent transition-all text-left">
                                <i class="fa-solid fa-user-graduate text-base w-5 text-center text-sky-400"></i>
                                <span>Data Santri / Siswa</span>
                            </button>

                            <button onclick="switchTab('guru')" id="nav-guru" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 font-medium border border-transparent transition-all text-left">
                                <i class="fa-solid fa-chalkboard-user text-base w-5 text-center text-indigo-400"></i>
                                <span>Data Guru / Ustadz</span>
                            </button>

                            <div class="pt-3 px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Dokumen & Sistem</div>

                            <button onclick="switchTab('cetak')" id="nav-cetak" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 font-medium border border-transparent transition-all text-left">
                                <i class="fa-solid fa-print text-base w-5 text-center text-emerald-400"></i>
                                <span>Cetak Rekap PDF</span>
                            </button>

                            <button onclick="switchTab('pengaturan')" id="nav-pengaturan" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 font-medium border border-transparent transition-all text-left">
                                <i class="fa-solid fa-gear text-base w-5 text-center text-amber-400"></i>
                                <span>Pengaturan Sistem</span>
                            </button>
                        </div>

                        <!-- User Info & Logout -->
                        <div class="p-4 border-t border-slate-800 bg-slate-950/40">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-primary-400">
                                    <i class="fa-solid fa-user-tie"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs font-semibold text-white truncate">${userDisplayName}</p>
                                    <p class="text-[10px] text-slate-400 truncate">Admin Absensi Ponpes</p>
                                </div>
                            </div>
                            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-medium text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition-all">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                <span>Keluar (Logout)</span>
                            </button>
                        </div>
                    </aside>

                    <!-- MAIN VIEWPORT CONTAINER -->
                    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto">
                        <!-- TOP NAVBAR -->
                        <header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-10 no-print">
                            <div class="flex items-center gap-3">
                                <button class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100" onclick="toggleMobileSidebar()">
                                    <i class="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div>
                                    <h2 id="top-title" class="text-base sm:text-lg font-bold text-slate-800">Laporan Absensi</h2>
                                    <p id="top-desc" class="text-xs text-slate-500 hidden sm:block">Pemantauan data kehadiran secara realtime</p>
                                </div>
                            </div>

                            <div class="flex items-center gap-3">
                                <div id="badge-sse-live" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-200">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>SSE Live Active</span>
                                </div>

                                <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-medium">
                                    <i class="fa-regular fa-clock text-primary-600"></i>
                                    <span id="live-clock">00:00:00 WIB</span>
                                </div>
                            </div>
                        </header>

                        <!-- DYNAMIC ACTIVE TAB CONTAINER (Only current tab is mounted here) -->
                        <div id="main-view-container" class="flex-1 flex flex-col"></div>
                    </main>
                </div>
            `;

            initLiveClock();
        }

        // -------------------------------------------------------------
        // 2. TAB SWITCHER (Mounts ONLY the active tab into DOM)
        // -------------------------------------------------------------
        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update Active Sidebar Link
            const tabs = ['laporan', 'santri', 'guru', 'cetak', 'pengaturan'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.classList.remove('bg-primary-600/20', 'text-primary-400', 'border-primary-500/30');
                    btn.classList.add('text-slate-300', 'border-transparent');
                }
            });

            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-300', 'border-transparent');
                activeBtn.classList.add('bg-primary-600/20', 'text-primary-400', 'border-primary-500/30');
            }

            const container = document.getElementById('main-view-container');
            const title = document.getElementById('top-title');
            const desc = document.getElementById('top-desc');

            if (tabName === 'laporan') {
                title.textContent = 'Laporan & Rekapitulasi Absensi';
                desc.textContent = 'Pemantauan data kehadiran santri dan guru secara realtime';
                renderTabLaporan(container);
            } else if (tabName === 'santri') {
                currentMemberTab = 'siswa';
                title.textContent = 'Data Santri / Siswa';
                desc.textContent = 'Kelola database kartu RFID dan informasi santri';
                renderTabMembers(container, 'siswa');
            } else if (tabName === 'guru') {
                currentMemberTab = 'guru';
                title.textContent = 'Data Guru / Asatidz';
                desc.textContent = 'Kelola database kartu RFID dan staf pengajar';
                renderTabMembers(container, 'guru');
            } else if (tabName === 'cetak') {
                title.textContent = 'Cetak Rekap Laporan';
                desc.textContent = 'Pratinjau cetak dan ekspor laporan ke format PDF resmi';
                renderTabCetak(container);
            } else if (tabName === 'pengaturan') {
                title.textContent = 'Pengaturan Sistem';
                desc.textContent = 'Kelola data contoh dummy, reset database, dan konfigurasi instansi';
                renderTabPengaturan(container);
            }
        }

        // TAB 1: LAPORAN ABSENSI
        function renderTabLaporan(container) {
            const today = new Date().toISOString().split('T')[0];
            container.innerHTML = `
                <section class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl w-full mx-auto">
                    <!-- METRIC CARDS -->
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-primary-50 text-primary-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-users"></i>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-slate-500">Total Kehadiran</p>
                                <h3 id="stat-total" class="text-2xl font-bold text-slate-800">0</h3>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-slate-500">Tepat Waktu</p>
                                <h3 id="stat-tepat" class="text-2xl font-bold text-emerald-600">0</h3>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-slate-500">Terlambat</p>
                                <h3 id="stat-telat" class="text-2xl font-bold text-rose-600">0</h3>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-slate-500">Siswa / Guru</p>
                                <h3 id="stat-komposisi" class="text-xl font-bold text-slate-800">0 / 0</h3>
                            </div>
                        </div>
                    </div>

                    <!-- FILTER & ACTIONS -->
                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-filter text-primary-600"></i>
                                <span class="font-bold text-slate-800 text-sm">Filter & Manajemen Data Absensi</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openAddAttendanceModal()" class="inline-flex items-center gap-2 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow transition-all">
                                    <i class="fa-solid fa-plus"></i>
                                    <span>Tambah Presensi Manual</span>
                                </button>
                                <button type="button" onclick="exportToCSV()" class="inline-flex items-center gap-2 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl border border-slate-300 transition-all text-xs">
                                    <i class="fa-solid fa-file-csv text-emerald-600"></i>
                                    <span>Export CSV</span>
                                </button>
                            </div>
                        </div>

                        <form id="form-filter" onsubmit="handleFilterSubmit(event)" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-12 gap-3 items-end">
                            <div class="lg:col-span-5">
                                <label for="filter-tanggal" class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Absensi</label>
                                <input type="date" id="filter-tanggal" value="${today}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-primary-500">
                            </div>

                            <div class="lg:col-span-4">
                                <label for="filter-tipe" class="block text-xs font-semibold text-slate-600 mb-1">Tipe Pengguna</label>
                                <select id="filter-tipe" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-primary-500 cursor-pointer">
                                    <option value="all">Semua Pengguna</option>
                                    <option value="siswa">Siswa</option>
                                    <option value="guru">Guru</option>
                                </select>
                            </div>

                            <div class="lg:col-span-3">
                                <button type="submit" id="btn-fetch" class="w-full flex items-center justify-center gap-2 py-2 px-4 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-xl shadow-md shadow-primary-600/20 transition-all text-xs">
                                    <i id="btn-fetch-icon" class="fa-solid fa-arrows-rotate"></i>
                                    <span id="btn-fetch-text">Tampilkan Data</span>
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- TABLE REKAPITULASI -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-4 sm:px-6 border-b border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800 text-sm">Daftar Rekapitulasi Presensi</span>
                                <span id="badge-total-records" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">0 Data</span>
                            </div>

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (!passwordInput || !eyeIcon) return;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';

            } else {
                passwordInput.type = 'password';

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const btnSubmit = document.getElementById('btn-login-submit');
            const btnText = document.getElementById('btn-login-text');
            const btnSpinner = document.getElementById('btn-login-spinner');

            btnSubmit.disabled = true;
            btnText.textContent = 'Memverifikasi...';
            btnSpinner.classList.remove('hidden');

            try {
                const response = await fetch(`${getApiBaseUrl()}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem(STORAGE_KEY_TOKEN, data.token);
                    localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(data.user || { username }));

                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil!',
                        text: 'Selamat datang di SIAKAD Absensi IoT',
                        timer: 1500,
                        showConfirmButton: false
                    });

                    initApp();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Gagal',
                        text: data.message || 'Username atau password salah.',
                        confirmButtonColor: '#0284c7'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Gagal',
                    text: 'Tidak dapat terhubung ke server backend.',
                    confirmButtonColor: '#0284c7'
                });
            } finally {
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnText.textContent = 'Masuk ke Dashboard';
                    btnSpinner.classList.add('hidden');
                }
            }
        }

        // -------------------------------------------------------------
        // 4. REALTIME SSE & LIVE CLOCK
        // -------------------------------------------------------------
        function initLiveClock() {
            if (clockInterval) clearInterval(clockInterval);
            const clockEl = document.getElementById('live-clock');
            if (!clockEl) return;
            const updateClock = () => {
                const now = new Date();
                const el = document.getElementById('live-clock');
                if (el) el.textContent = now.toLocaleTimeString('id-ID', { hour12: false }) + ' WIB';
            };
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
        }

        function initSSE() {
            if (sseEventSource) return;

            const url = `${getApiBaseUrl()}/api/realtime`;
            sseEventSource = new EventSource(url);

            sseEventSource.onopen = () => {
                console.log("⚡ SSE Realtime Stream Connected!");
                const badge = document.getElementById('badge-sse-live');
                if (badge) badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span><span>SSE Live Active</span>`;
            };

            sseEventSource.addEventListener('attendance_tap', (e) => {
                try {
                    const eventData = JSON.parse(e.data);
                    handleRealtimeTapEvent(eventData);
                } catch (err) {
                    console.error("Gagal parse realtime tap:", err);
                }
            });
        }

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch (e) {}
        }

        function handleRealtimeTapEvent(eventData) {
            playChime();
            const record = eventData.record || {};
            const message = eventData.message;
            const isAlready = eventData.status === 'already_attended' || eventData.already_recorded;

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: isAlready ? 'info' : 'success',
                title: isAlready ? `ℹ️ ${record.nama || 'Anggota'}` : `🎉 ${record.nama || 'Anggota'}`,
                text: `${message} (${record.id_mesin || 'ESP32'})`,
                showConfirmButton: false,
                timer: 4000,
                timerProgressBar: true
            });

            if (currentTab === 'laporan') {
                const filterTgl = document.getElementById('filter-tanggal') ? document.getElementById('filter-tanggal').value : '';
                const today = new Date().toISOString().split('T')[0];

                if (filterTgl === today && record.id) {
                    const existingIdx = rawAttendanceData.findIndex(item => item.id === record.id || (item.uid === record.uid && item.tanggal === record.tanggal));
                    if (existingIdx >= 0) {
                        rawAttendanceData[existingIdx] = record;
                    } else {
                        rawAttendanceData.unshift(record);
                    }
                    renderTableData(rawAttendanceData, true);
                    updateStatistics(rawAttendanceData);
                }
            }
        }

        async function fetchMembersCache() {
            const token = getAuthToken();
            if (!token) return;
            try {
                const res = await fetch(`${getApiBaseUrl()}/api/members?tipe=all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                allMembersCache = result.data || [];
            } catch (e) {
                console.error("Gagal memuat cache member:", e);
            }
        }

        function handleFilterSubmit(e) {
            e.preventDefault();
            fetchAttendanceData();
        }

        async function fetchAttendanceData() {
            const token = getAuthToken();
            if (!token) return forceLogout();

            const tglEl = document.getElementById('filter-tanggal');
            const tipeEl = document.getElementById('filter-tipe');
            if (!tglEl || !tipeEl) return;

            const tanggal = tglEl.value;
            const tipe = tipeEl.value;
            const btnFetchIcon = document.getElementById('btn-fetch-icon');

            if (btnFetchIcon) btnFetchIcon.classList.add('fa-spin');
            renderTableSkeleton();

            try {
                const response = await fetch(`${getApiBaseUrl()}/api/attendance?tanggal=${tanggal}&tipe=${tipe}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) return forceLogout('Sesi telah berakhir.');
                const result = await response.json();

                rawAttendanceData = result.data || [];
                renderTableData(rawAttendanceData);
                updateStatistics(rawAttendanceData);
            } catch (err) {
                renderTableError(err.message);
            } finally {
                if (btnFetchIcon) btnFetchIcon.classList.remove('fa-spin');
            }
        }

        function renderTableData(dataList, isLiveHighlight = false) {
            const tbody = document.getElementById('attendance-table-body');
            const badgeCount = document.getElementById('badge-total-records');
            if (!tbody) return;
            if (badgeCount) badgeCount.textContent = `${dataList.length} Data`;

            if (dataList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="py-12 text-center text-slate-400">

                            <p class="font-medium text-slate-600 text-sm">Tidak ada data absensi ditemukan</p>
                        </td>
                    </tr>`;
                return;
            }

            let html = '';
            dataList.forEach((item, index) => {
                const tipeBadge = (item.tipe || 'siswa').toLowerCase() === 'guru'
                    ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">Guru</span>`
                    : `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-50 text-sky-700 border border-sky-200">Siswa</span>`;

                let statusMasukBadge = `<span class="text-slate-400 text-xs">-</span>`;
                const sm = (item.status_masuk || '').toLowerCase();
                if (sm.includes('tepat')) {
                    statusMasukBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"><i class="fa-solid fa-check mr-1"></i>Tepat</span>`;
                } else if (sm.includes('telat')) {
                    statusMasukBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Telat</span>`;
                } else if (sm === 'izin' || sm === 'sakit') {
                    statusMasukBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 capitalize">${sm}</span>`;
                }

                let statusKeluarBadge = `<span class="text-slate-400 text-xs">-</span>`;
                const sk = (item.status_keluar || '').toLowerCase();
                if (sk.includes('tepat')) {
                    statusKeluarBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">Tepat</span>`;
                } else if (sk.includes('cepat')) {
                    statusKeluarBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">Cepat</span>`;
                }

                const highlightClass = (isLiveHighlight && index === 0) ? 'row-highlight' : '';

                html += `
                    <tr class="hover:bg-slate-50 transition-colors ${highlightClass}">
                        <td class="py-3.5 px-4 text-center font-medium text-slate-400 text-xs">${index + 1}</td>
                        <td class="py-3.5 px-4">
                            <p class="font-semibold text-slate-800">${item.nama}</p>
                            <p class="text-[11px] text-slate-400">${item.kelas || '-'}</p>
                        </td>
                        <td class="py-3.5 px-4">${tipeBadge}</td>
                        <td class="py-3.5 px-4 font-mono text-xs text-slate-600">${item.waktu_masuk || '-'}</td>
                        <td class="py-3.5 px-4">${statusMasukBadge}</td>

                        <td class="py-3.5 px-4">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 border border-slate-200 font-mono text-[11px] text-slate-600">
                                <i class="fa-solid fa-microchip text-slate-400"></i> ${item.id_mesin || 'ESP32'}

                            </div>

        function renderTableSkeleton() {
            const tbody = document.getElementById('attendance-table-body');

        function renderTableError(msg) {
            const tbody = document.getElementById('attendance-table-body');
            if (!tbody) return;
            tbody.innerHTML = `

                    <td colspan="9" class="py-8 text-center text-rose-600 text-xs">

                        <p class="font-bold">Gagal memuat data</p>
                        <p>${msg}</p>
                    </td>
                </tr>`;
        }

        function updateStatistics(items) {
            let tepat = 0, telat = 0, siswa = 0, guru = 0;
            items.forEach(item => {
                const s = (item.status_masuk || '').toLowerCase();
                const t = (item.tipe || '').toLowerCase();
                if (s.includes('tepat')) tepat++;
                if (s.includes('telat')) telat++;
                if (t === 'guru') guru++; else siswa++;
            });
            const st = document.getElementById('stat-total');
            const stp = document.getElementById('stat-tepat');
            const stl = document.getElementById('stat-telat');
            const sk = document.getElementById('stat-komposisi');
            if (st) st.textContent = items.length;
            if (stp) stp.textContent = tepat;
            if (stl) stl.textContent = telat;
            if (sk) sk.textContent = `${siswa} / ${guru}`;
        }

        function handleTableSearch(val) {
            const q = val.toLowerCase().trim();
            if (!q) return renderTableData(rawAttendanceData);
            const f = rawAttendanceData.filter(i => 
                (i.nama || '').toLowerCase().includes(q) || 
                (i.id_mesin || '').toLowerCase().includes(q) ||
                (i.kelas || '').toLowerCase().includes(q)
            );
            renderTableData(f);
        }

                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.nama} (${m.kelas || m.uid})`;

        async function handleSaveAttendance(e) {
            e.preventDefault();
            const token = getAuthToken();
            const id = document.getElementById('att-id').value;
            const nama = document.getElementById('att-nama').value.trim();
            const uid = document.getElementById('att-uid').value.trim() || 'MANUAL';
            const tipe = document.getElementById('att-tipe').value;
            const kelas = document.getElementById('att-kelas').value.trim();
            const tanggal = document.getElementById('att-tanggal').value;
            const waktu_masuk = document.getElementById('att-waktu-masuk').value || '-';
            const status_masuk = document.getElementById('att-status-masuk').value;
            const waktu_keluar = document.getElementById('att-waktu-keluar').value || '-';
            const status_keluar = document.getElementById('att-status-keluar').value;
            const id_mesin = document.getElementById('att-device').value.trim() || 'MANUAL';

            if (!nama) {
                Swal.fire('Peringatan', 'Silakan pilih anggota dari Data Master terlebih dahulu.', 'warning');
                return;
            }

            const isEdit = !!id;
            const method = isEdit ? 'PUT' : 'POST';
            const payload = { uid, nama, tipe, kelas, tanggal, waktu_masuk, status_masuk, waktu_keluar, status_keluar, id_mesin };
            if (isEdit) payload.id = parseInt(id);

            try {
                const res = await fetch(`${getApiBaseUrl()}/api/attendance`, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Berhasil', text: data.message, timer: 1500, showConfirmButton: false });
                    closeModal();
                    fetchAttendanceData();
                } else {
                    Swal.fire('Gagal', data.message || 'Terjadi kesalahan.', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Gagal menghubungi server.', 'error');
            }
        }

        function exportToCSV() {
            if (!rawAttendanceData.length) return Swal.fire('Info', 'Tidak ada data untuk diekspor.', 'info');
            const tanggal = document.getElementById('filter-tanggal') ? document.getElementById('filter-tanggal').value : 'hari_ini';
            const headers = ['No', 'Nama', 'Tipe', 'Kelas', 'Waktu Masuk', 'Status Masuk', 'Waktu Keluar', 'Status Keluar', 'Mesin'];
            const rows = rawAttendanceData.map((item, i) => [
                i + 1,
                `"${item.nama}"`,
                item.tipe,
                `"${item.kelas || '-'}"`,
                item.waktu_masuk || '-',
                item.status_masuk || '-',
                item.waktu_keluar || '-',
                item.status_keluar || '-',
                item.id_mesin || 'ESP32'
            ]);
            const csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const link = document.createElement('a');
            link.href = encodeURI(csv);
            link.download = `rekap_absensi_${tanggal}.csv`;
            link.click();
        }

        async function loadMemberList(tipe, search = '') {
            const token = getAuthToken();

            const tbody = document.getElementById('member-table-body');
            if (!tbody) return;
            tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat data...</td></tr>`;

            try {
                const res = await fetch(`${getApiBaseUrl()}/api/members?tipe=${tipe}&search=${encodeURIComponent(search)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                const members = result.data || [];

                const badge = document.getElementById('badge-member-count');
                if (badge) badge.textContent = `${members.length} Anggota`;

                if (members.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400 text-xs">Belum ada data anggota. Silakan tambah baru.</td></tr>`;

                    }
                }
            });
        }

        function handleResetAttendance() {
            Swal.fire({
                title: 'Hapus Semua Data Absensi?',
                text: 'Seluruh riwayat kehadiran akan dikosongkan. Data santri dan guru TIDAK akan terhapus.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d97706',
                confirmButtonText: 'Ya, Kosongkan Absensi',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const token = getAuthToken();
                    try {
                        const res = await fetch(`${getApiBaseUrl()}/api/settings/reset-attendance`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        if (res.ok) {
                            Swal.fire({ icon: 'success', title: 'Dibersihkan', text: data.message, timer: 1800, showConfirmButton: false });
                            if (currentTab === 'laporan') fetchAttendanceData();
                        }
                    } catch (e) {
                        Swal.fire('Error', 'Gagal mereset data absensi.', 'error');
                    }
                }
            });
        }

        function handleResetAll() {
            Swal.fire({
                title: 'Reset Total Database?',
                html: '<span class="text-rose-600 font-bold">PERINGATAN!</span> Tindakan ini akan menghapus SEMUA data santri, guru, dan riwayat absensi. Database akan kembali kosong.',
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Ya, Reset Total',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const token = getAuthToken();
                    try {
                        const res = await fetch(`${getApiBaseUrl()}/api/settings/reset-all`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        if (res.ok) {
                            Swal.fire({ icon: 'success', title: 'Reset Berhasil', text: data.message, timer: 2000, showConfirmButton: false });
                            fetchMembersCache();
                            if (currentTab === 'laporan') fetchAttendanceData();
                        }
                    } catch (e) {
                        Swal.fire('Error', 'Gagal mereset database.', 'error');
                    }
                }
            });
        }

        // -------------------------------------------------------------
        // 9. CETAK REKAP LAPORAN (PDF)
        // -------------------------------------------------------------
        function toggleCetakMode(mode) {
            const containerTgl = document.getElementById('container-cetak-tanggal');
            const containerBln = document.getElementById('container-cetak-bulan');
            if (mode === 'bulanan') {
                if (containerTgl) containerTgl.classList.add('hidden');
                if (containerBln) containerBln.classList.remove('hidden');
            } else {
                if (containerTgl) containerTgl.classList.remove('hidden');
                if (containerBln) containerBln.classList.add('hidden');
            }
            loadPrintPreview();
        }

        async function loadPrintPreview() {
            const token = getAuthToken();
            if (!token) return;

            const modeEl = document.getElementById('cetak-mode');
            const tipeEl = document.getElementById('cetak-tipe');
            const tglEl = document.getElementById('cetak-tanggal');
            const blnEl = document.getElementById('cetak-bulan');
            if (!modeEl || !tipeEl) return;

            const mode = modeEl.value;
            const tipe = tipeEl.value;
            const tgl = tglEl ? tglEl.value : '';
            const bln = blnEl ? blnEl.value : '';

            let url = `${getApiBaseUrl()}/api/attendance?tipe=${tipe}`;
            const periodeEl = document.getElementById('print-periode-info');
            if (mode === 'bulanan') {
                url += `&bulan=${bln}`;
                if (periodeEl) periodeEl.textContent = `Periode: Rekapitulasi Bulan ${bln}`;
            } else {
                url += `&tanggal=${tgl}`;
                if (periodeEl) periodeEl.textContent = `Periode: Tanggal ${tgl}`;
            }

            const tsEl = document.getElementById('print-timestamp');
            if (tsEl) tsEl.textContent = new Date().toLocaleString('id-ID');

            const tbody = document.getElementById('print-table-body');
            if (!tbody) return;
            tbody.innerHTML = `<tr><td colspan="9" class="py-4 text-center">Memuat data pratinjau cetak...</td></tr>`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                const result = await res.json();
                const list = result.data || [];

                if (list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="py-6 text-center text-slate-400">Tidak ada data absensi untuk periode ini.</td></tr>`;
                    return;
                }

                let html = '';
                list.forEach((item, idx) => {
                    html += `
                        <tr class="border-b border-slate-200">
                            <td class="py-2 px-3 text-center">${idx + 1}</td>
                            <td class="py-2 px-3 font-semibold">${item.nama}</td>
                            <td class="py-2 px-3 capitalize">${item.tipe}</td>
                            <td class="py-2 px-3">${item.kelas || '-'}</td>
                            <td class="py-2 px-3 text-center font-mono">${item.tanggal || '-'}</td>
                            <td class="py-2 px-3 text-center font-mono">${item.waktu_masuk || '-'}</td>
                            <td class="py-2 px-3 text-center capitalize">${item.status_masuk || '-'}</td>
                            <td class="py-2 px-3 text-center font-mono">${item.waktu_keluar || '-'}</td>
                            <td class="py-2 px-3 text-center">${item.id_mesin || 'ESP32'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-4 text-center text-rose-600">Gagal memuat preview cetak.</td></tr>`;
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('hidden');
        }
    </script>
