<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Emerald Cyan Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Card Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- RFID Contactless Signal Waves (Top Right) -->
  <path d="M 330 140 A 130 130 0 0 1 410 220" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <path d="M 300 170 A 90 90 0 0 1 360 230" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.7" />
  <path d="M 270 200 A 50 50 0 0 1 310 240" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" opacity="0.55" />

  <!-- Central Smart Card Body -->
  <rect x="110" y="150" width="292" height="200" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" filter="url(#glow)" />
  
  <!-- Smart Card Chip Gold -->
  <rect x="145" y="215" width="60" height="50" rx="10" fill="url(#goldGrad)" stroke="#d97706" stroke-width="2" />
  <line x1="145" y1="240" x2="205" y2="240" stroke="#78350f" stroke-width="2" />
  <line x1="175" y1="215" x2="175" y2="265" stroke="#78350f" stroke-width="2" />

  <!-- Graduation Cap (Education & Pondok Symbol) -->
  <g transform="translate(256, 210)">
    <!-- Cap Top Diamond -->
    <polygon points="0,-48 85,-18 0,12 -85,-18" fill="url(#accentGrad)" />
    <!-- Cap Under Base -->
    <path d="M -50 -5 L -50 24 C -50 48 50 48 50 24 L 50 -5 Z" fill="#0284c7" opacity="0.9" />
    <!-- Tassel -->
    <path d="M 55 -8 C 65 5 70 20 72 38" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="72" cy="42" r="5" fill="#fbbf24" />
  </g>

  <!-- Bottom IoT Indicator Pulse -->
  <circle cx="256" cy="405" r="8" fill="#10b981" />
  <circle cx="256" cy="405" r="16" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="r" values="8;24;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
